<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butler CAM</title>
<style>
:root { color-scheme: light dark; --bg:#f6f6f9; --card:#ffffff; --ink:#1d1e24; --sub:#62646f; --edge:#e2e3ea; --accent:#5a5fd0; }
@media (prefers-color-scheme: dark) { :root { --bg:#1d1e24; --card:#26272e; --ink:#ececf1; --sub:#a2a4b2; --edge:#373842; --accent:#a3aaf5; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:40px 16px 64px; }
main { max-width:680px; margin:0 auto; }
h1 { font-size:32px; line-height:1.2; margin:0 0 6px; }
h2 { font-size:20px; margin:30px 0 8px; }
h3 { font-size:17px; margin:18px 0 2px; }
p, ol { margin:0 0 12px; }
ol { padding-left:24px; }
.sub { color:var(--sub); margin-bottom:24px; }
.contact { background:var(--card); border:1px solid var(--edge); border-radius:14px; padding:16px 20px; }
.contact p { margin:0; }
a { color:var(--accent); overflow-wrap:anywhere; }
footer { margin-top:40px; color:var(--sub); font-size:14px; }
</style>
</head>
<body>
<main>
<h1>Butler CAM</h1>
<p class="sub">Design and cut on your CNC, on Mac and iPad.</p>
<div class="contact"><p>Draw your project, choose how to cut it, watch it carve in 3D, and save G-code for your CNC router or laser.</p></div>
<h2>Help and policies</h2>
<p><a href="support.html">Support</a></p>
<p><a href="privacy.html">Privacy Policy</a></p>
<footer>© 2026 Butler Makes LLC</footer>
</main>
</body>
</html>
